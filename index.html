<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <p> Click on 1</p>
    <p> Click on 2</p>
    <p> Click on 3</p>
    <p> Click on 4</p>
    <p> Click on 5</p>
</body>
<script src="jq/jquery-4.0.0.min.js"></script>

<script>
    $(document).ready(function(){

        //properties //
        $('p').click( function() {
        console.log("  Radha rani");
        $(this).hide();
    });
 // Events in j query //

 // Mouse Events //
  $('p ').dblclick(function (){
    console.log("you doble click on :" ,this);
  });

  $('p:first').mouseenter(function (){
    console.log("Your  mouseenter evet fired : " , this);
  });

  $('p').mouseup(function (){
    console.log(" your mouse up event fired" , this);
  });

  $('p').mouseleave(function(){
     console.log(" your mouseleave event fired" ,this);
  });
   // hover  specially it take two parameter //
    $('p').hover(function (){
        console.log (" mouse in the elemant " , this);
    }, function (){
        console.log("mouse out from the element " , this)
    });

    });
    
</script>

</html>
